[package]
name = "fael"
version = "0.56.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/zecalis/fael"
homepage = "https://github.com/zecalis/fael"
description = "fael CLI — the repo's work ledger, handed to each agent at the file or chunk it works on"

[dependencies]
fael-core = { path = "../fael-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["fael-core/bundled-sqlite"]

[lints]
workspace = true
