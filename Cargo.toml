[workspace]
members = ["fael-core", "fael-crew", "fael"]
resolver = "3"

[profile.release]
strip = true
lto = true
# Smaller binary: one codegen unit, abort on panic (no unwinding tables), size-tuned opt level.
codegen-units = 1
panic = "abort"
opt-level = "s"

# cargo-dist builds with this profile
[profile.dist]
inherits = "release"

# Long functions are what grow into god files; scripts/file-size.sh guards whole files.
[workspace.lints.clippy]
too_many_lines = "warn"
