name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # branch protection requires `gate` alone, so the jobs below may skip on a prose-only
  # PR: a skipped matrix job reports as bare `test`, never `test (<os>)`, which left
  # a per-job requirement pending forever
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # ponytail: a short allowlist of files nothing compiles. docs/ and skill/ stay out:
      # include_str! builds docs/architecture.md and skill/SKILL.md into the binary
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = pull_request ] &&
             ! git diff --name-only HEAD^1 HEAD |
               grep -qvE '^[^/]+\.md$|^LICENSE|^\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$)'; then
            echo rust=false >> "$GITHUB_OUTPUT"
          else
            echo rust=true >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # main's run warms every OS; PR runs only read it (a PR cache is visible to
          # that PR alone, so saving it is upload time for nobody)
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: scripts/file-size.sh

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # main's run warms every OS; PR runs only read it (a PR cache is visible to
          # that PR alone, so saving it is upload time for nobody)
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # nextest pools every test binary's tests; `cargo test` runs the ~35 binaries one
      # after another, so Windows (slow process spawn) idles on small binaries
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --locked --no-fail-fast

  msrv:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          # main's run warms every OS; PR runs only read it (a PR cache is visible to
          # that PR alone, so saving it is upload time for nobody)
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --locked

  gate:
    if: always()
    needs: [changes, lint, test, msrv]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo ok
