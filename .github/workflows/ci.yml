name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # branch protection requires `gate` alone, so the jobs below may skip on a prose-only
  # PR: a skipped matrix job reports as bare `test`, never `test (<os>)`, which left
  # a per-job requirement pending forever
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # ponytail: a short allowlist of files nothing compiles. skill/ stays out:
      # include_str! builds skill/SKILL.md into the binary. docs/*.md only feeds tests
      # (help/tests.rs reads architecture.md, tests/doc_refs.rs every .md), so a
      # docs-only PR runs the tests on one OS and skips lint and msrv
      - id: diff
        run: |
          rust=true
          docs=false
          prose='^[^/]+\.md$|^LICENSE|^\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$)'
          if [ "${{ github.event_name }}" = pull_request ]; then
            # fail closed: a failed diff aborts the step (bash -e), an empty one runs all
            files=$(git diff --name-only HEAD^1 HEAD)
            if [ -n "$files" ] && ! grep -qvE "$prose" <<<"$files"; then
              rust=false
            elif [ -n "$files" ] && ! grep -qvE "$prose|^docs/.+\.md$" <<<"$files"; then
              docs=true
            fi
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # main's run warms every OS; PR runs only read it (a PR cache is visible to
          # that PR alone, so saving it is upload time for nobody)
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: scripts/file-size.sh

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.docs == 'true' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # main's run warms every OS; PR runs only read it (a PR cache is visible to
          # that PR alone, so saving it is upload time for nobody)
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # nextest pools every test binary's tests; `cargo test` runs the ~35 binaries one
      # after another, so Windows (slow process spawn) idles on small binaries
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --locked --no-fail-fast

  msrv:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          # main's run warms every OS; PR runs only read it (a PR cache is visible to
          # that PR alone, so saving it is upload time for nobody)
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --locked

  gate:
    if: always()
    needs: [changes, lint, test, msrv]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      # a skip passes only when changes said rust=false outright, never on a missing output;
      # docs=true lets lint and msrv skip, never test
      - if: needs.changes.outputs.rust != 'false' && needs.changes.outputs.docs != 'true' && contains(needs.*.result, 'skipped')
        run: exit 1
      - if: needs.changes.outputs.docs == 'true' && needs.test.result != 'success'
        run: exit 1
      - run: echo ok
